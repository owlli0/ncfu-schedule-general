<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- х.14 current date  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание СКФУ</title>
  
  <!-- PWA параметры -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Расписание">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      
      --lecture-bg: rgba(16, 185, 129, 0.15);
      --lecture-border: rgba(16, 185, 129, 0.45);
      --lecture-badge: #10b981;
      
      --practice-bg: rgba(245, 158, 11, 0.15);
      --practice-border: rgba(245, 158, 11, 0.45);
      --practice-badge: #f59e0b;

      --default-bg: rgba(255, 255, 255, 0.05);
      --default-border: var(--border);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .container { width: 100%; max-width: 880px; }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: var(--text); }
    .status-text { font-size: 0.8rem; color: var(--text-muted); }

    .subgroup-toggle {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .sg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sg-btn:hover { color: var(--text); }
    .sg-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .theme-btn:hover { border-color: var(--accent); }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }

    .catalog-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .catalog-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 360px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }

    .autocomplete-item {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.92rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: rgba(255,255,255,0.06); color: var(--accent); }
    .autocomplete-type { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    .week-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      gap: 8px;
      position: relative;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

    .date-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .date-btn:hover { border-color: var(--accent); }

    .custom-calendar-popup {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      width: 320px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      z-index: 60;
      display: none;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .cal-nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-weekday {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      padding-bottom: 6px;
    }

    .cal-day-cell {
      padding: 8px 0;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      position: relative;
      color: var(--text);
      transition: background 0.15s;
    }
    .cal-day-cell:hover:not(.empty) { background: rgba(255,255,255,0.08); }
    .cal-day-cell.empty { cursor: default; opacity: 0.3; }
    
    .cal-day-cell.in-week {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 700;
    }
    .cal-day-cell.selected {
      background: var(--accent) !important;
      color: #000 !important;
      font-weight: 700;
    }

    .cal-day-cell.has-classes::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--accent);
    }
    .cal-day-cell.selected.has-classes::after {
      background-color: #000;
    }

    /* Кнопка показа прошедших дней */
    .past-days-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .past-days-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: var(--accent);
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .day-card.today-card {
      border-color: rgba(56, 189, 248, 0.45);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .day-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .today-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--accent);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .day-date { font-size: 0.85rem; color: var(--text-muted); }

    .break-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .break-indicator::before, .break-indicator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      margin: 0 10px;
    }

    .lesson-item {
      display: grid;
      grid-template-columns: 85px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid transparent;
    }

    .type-lecture {
      background: var(--lecture-bg);
      border-color: var(--lecture-border);
    }
    .type-practice, .type-lab {
      background: var(--practice-bg);
      border-color: var(--practice-border);
    }
    .type-other {
      background: var(--default-bg);
      border-color: var(--default-border);
    }

    .pair-time-block { display: flex; flex-direction: column; }
    .pair-num { font-size: 0.85rem; font-weight: 700; color: var(--text); }
    .pair-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .lesson-main { display: flex; flex-direction: column; gap: 4px; }
    .lesson-title { font-size: 0.95rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    .lesson-meta { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; flex-wrap: wrap; }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-lec { background: var(--lecture-badge); color: #000; }
    .badge-prac { background: var(--practice-badge); color: #000; }
    .badge-def { background: rgba(255,255,255,0.2); color: var(--text); }

    .subgroup-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .room-tag {
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .teacher-block {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
      font-weight: 500;
      max-width: 240px;
    }

    .empty-day {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 10px 0;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { font-size: 1.15rem; color: var(--text); }
    .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .catalog-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }

    .catalog-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s;
      text-align: center;
      word-break: break-word;
    }
    .catalog-item.full-width {
      text-align: left;
    }
    .catalog-item:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
    }

    .catalog-breadcrumbs {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
    }

    .theme-presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .preset-btn {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    .preset-btn:hover { border-color: var(--accent); }

    .custom-colors-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .color-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .color-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-picker {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
    }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 8px; }

    /* ========================================================
       МОБИЛЬНЫЙ ДИЗАЙН: ВСЁ СЛЕВА, ТОЛЬКО ФИО СПРАВА
       ======================================================== */
    @media (max-width: 650px) {
      body {
        padding: 0 8px 24px 8px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 45;
        background: var(--bg);
        padding: 8px 4px 10px 4px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        gap: 8px;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .header-title-wrap {
        gap: 6px;
        max-width: 70vw;
      }

      h1 {
        font-size: 1.05rem;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 44vw;
        text-align: left;
      }

      .subgroup-toggle {
        padding: 1px;
        gap: 1px;
      }

      .sg-btn {
        padding: 3px 6px;
        font-size: 0.7rem;
      }

      .header-actions {
        gap: 6px;
      }

      .theme-btn {
        padding: 4px 8px;
        font-size: 0.78rem;
        border-radius: 8px;
      }

      .status-text {
        display: none;
      }

      .search-row {
        display: flex;
        flex-direction: row;
        gap: 6px;
      }

      .search-input {
        padding: 8px 10px;
        font-size: 0.85rem;
        border-radius: 8px;
      }

      .catalog-btn {
        padding: 8px 10px;
        font-size: 0.8rem;
        border-radius: 8px;
      }

      .week-nav-bar {
        padding: 5px 6px;
        margin-bottom: 8px;
        gap: 4px;
        border-radius: 10px;
      }

      .nav-btn {
        padding: 6px 8px;
        font-size: 0.78rem;
        border-radius: 6px;
      }

      .date-btn {
        padding: 6px 8px;
        font-size: 0.8rem;
        border-radius: 6px;
        gap: 4px;
      }

      .custom-calendar-popup {
        width: 94vw;
        max-width: 320px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px;
      }

      .day-card {
        padding: 10px 10px;
        margin-bottom: 12px;
        border-radius: 12px;
      }

      .day-header {
        margin-bottom: 8px;
        padding-bottom: 4px;
      }

      .day-title {
        font-size: 0.95rem;
      }

      .day-date {
        font-size: 0.78rem;
      }

      .break-indicator {
        margin: 6px 0;
        font-size: 0.72rem;
      }

      .break-indicator::before, .break-indicator::after {
        margin: 0 6px;
      }

      .lesson-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 9px 10px;
        border-radius: 9px;
        margin-bottom: 6px;
        text-align: left;
      }

      .pair-time-block {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 6px;
        width: 100%;
        text-align: left;
      }

      .pair-num {
        font-size: 0.76rem;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 5px;
        border-radius: 4px;
      }

      .pair-hours {
        font-size: 0.75rem;
        margin-top: 0;
        color: var(--text-muted);
      }

      .lesson-main {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        gap: 4px;
        text-align: left;
      }

      .lesson-title {
        font-size: 0.92rem;
        font-weight: 600;
        line-height: 1.25;
        color: var(--text);
        word-break: break-word;
        text-align: left;
        width: 100%;
      }

      .lesson-meta {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
        flex-wrap: wrap;
        font-size: 0.72rem;
        margin-top: 1px;
        width: 100%;
      }

      .badge {
        font-size: 0.68rem;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .subgroup-tag, .room-tag {
        font-size: 0.72rem;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .teacher-block {
        align-self: flex-end;
        text-align: right;
        width: 100%;
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 2px;
        padding-top: 2px;
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
        max-width: 100%;
        line-height: 1.25;
      }

      .groups-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 5px;
      }

      .modal-content {
        max-height: 90vh;
        border-radius: 12px;
      }
      .modal-header { padding: 10px 14px; }
      .modal-header h2 { font-size: 0.98rem; }
      .modal-body { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="header-title-wrap">
          <h1 id="groupTitle">ИНС-б-о-26-2</h1>
          
          <div id="subgroupToggle" class="subgroup-toggle" style="display: none;">
            <button class="sg-btn active" data-sg="all" onclick="setSubgroup('all')">Все</button>
            <button class="sg-btn" data-sg="1" onclick="setSubgroup('1')">1 п/г</button>
            <button class="sg-btn" data-sg="2" onclick="setSubgroup('2')">2 п/г</button>
          </div>
        </div>

        <div class="header-actions">
          <button class="theme-btn" onclick="openThemeModal()">🎨 Тема</button>

          <button class="preset-btn" onclick="applyPreset('dark')">🌙 Тёмная</button>

        <div class="custom-colors-grid">

              <input type="color" id="picker-accent" class="color-picker" onchange="onCustomColorChange('--accent', this.value)">

            <span>Цвет лекций</span>
            <div class="color-input-wrap">
              <input type="color" id="picker-lecture" class="color-picker" onchange="onCustomLectureChange(this.value)">
            </div>

            <span>Цвет практик</span>
            <div class="color-input-wrap">
              <input type="color" id="picker-practice" class="color-picker" onchange="onCustomPracticeChange(this.value)">
            </div>
          </div>
          <div class="color-row">
            <span>Цвет текста</span>
            <div class="color-input-wrap">
              <input type="color" id="picker-text" class="color-picker" onchange="onCustomColorChange('--text', this.value)">
            </div>
          </div>
        </div>
      </div>

  <script>
    const API_BASE = 'https://ecampus.ncfu.ru/schedule';

    // Твой персональный Cloudflare Worker
    const WORKER_PROXY_URL = 'https://morning-cloud-895b.balavensydbu.workers.dev/?url=';

    const PROXY_PROVIDERS = [
      (url) => `${WORKER_PROXY_URL}${encodeURIComponent(url)}`,
      (url) => `https://api.cors.lol/?url=${encodeURIComponent(url)}`,
      (url) => `https://proxy.corsfix.com/?${url}`
    ];

    let currentProxyIndex = 0;

    async function fetchWithProxy(targetUrl, options = {}) {
      let lastError = null;
      for (let i = 0; i < PROXY_PROVIDERS.length; i++) {
        const pIdx = (currentProxyIndex + i) % PROXY_PROVIDERS.length;
        const proxyUrl = PROXY_PROVIDERS[pIdx](targetUrl);

        try {
          const res = await fetch(proxyUrl, options);
          if (res.ok || res.status === 302) {
            currentProxyIndex = pIdx;
            return res;
          } else if (res.status === 401 || res.status === 403 || res.status === 429 || res.status >= 500) {
            throw new Error(`HTTP ${res.status}`);
          }
          return res;
        } catch (err) {
          if (err.name === 'AbortError') throw err;
          lastError = err;
        }
      }
      throw lastError || new Error('Все прокси-серверы недоступны');
    }

    const CALL_TIMES = {
      1: { start: "08:00", end: "09:30" },
      2: { start: "09:40", end: "11:10" },
      3: { start: "11:20", end: "12:50" },
      4: { start: "13:20", end: "14:50" },
      5: { start: "15:00", end: "16:30" },
      6: { start: "16:50", end: "18:20" },
      7: { start: "18:30", end: "20:00" },
      8: { start: "20:10", end: "21:40" }
    };

    const INSTITUTES = [
      { Id: 4336, ShortName: "ВШКИ", BranchId: 1, Name: "Высшая школа креативных индустрий" },
      { Id: 2740, ShortName: "ГИ", BranchId: 1, Name: "Гуманитарный институт" },
      { Id: 4436, ShortName: "ККИВШКИ", BranchId: 1, Name: "Колледж креативных индустрий" },
      { Id: 4325, ShortName: "КСКФУ", BranchId: 1, Name: "Колледж СКФУ" },
      { Id: 4262, ShortName: "МБФ", BranchId: 1, Name: "Медико-биологический факультет" },
      { Id: 4407, ShortName: "ИПИнж", BranchId: 1, Name: "Институт перспективной инженерии" },
      { Id: 4286, ShortName: "ППФ", BranchId: 1, Name: "Психолого-педагогический факультет" },
      { Id: 4320, ShortName: "ФМКН", BranchId: 1, Name: "Факультет математики и компьютерных наук им. Н.И. Червякова" },
      { Id: 4411, ShortName: "ФМО", BranchId: 1, Name: "Факультет международных отношений" },
      { Id: 4383, ShortName: "ФНИ", BranchId: 1, Name: "Факультет нефтегазовой инженерии" },
      { Id: 4287, ShortName: "ФПИБ", BranchId: 1, Name: "Факультет пищевой инженерии и биотехнологий" },
      { Id: 4288, ShortName: "ФФКС", BranchId: 1, Name: "Факультет физической культуры и спорта" },
      { Id: 4197, ShortName: "ФТФ", BranchId: 1, Name: "Физико-технический факультет" },
      { Id: 4189, ShortName: "ХимФ", BranchId: 1, Name: "Химический факультет" },
      { Id: 2798, ShortName: "ИЭиУ", BranchId: 1, Name: "Институт экономики и управления" },
      { Id: 2716, ShortName: "ЮИ", BranchId: 1, Name: "Юридический институт" },
      { Id: null, ShortName: "НТИ СКФУ", BranchId: 4, Name: "Невинномысский технологический институт (филиал)" },
      { Id: null, ShortName: "ПИ СКФУ", BranchId: 2, Name: "Пятигорский институт (филиал)" }
    ];

    const MEMORY_CACHE = {};
    const CACHE_TTL_MS = 6 * 60 * 60 * 1000;

    try {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('cache_search_')) localStorage.removeItem(k);
      });
    } catch (e) {}

    function getCache(key) {
      if (MEMORY_CACHE[key]) return MEMORY_CACHE[key];
      try {
        const stored = localStorage.getItem('cache_' + key);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Date.now() - parsed.ts < CACHE_TTL_MS) {
            MEMORY_CACHE[key] = parsed.data;
            return parsed.data;
          }
        }
      } catch (e) {}
      return null;
    }

    function setCache(key, data) {
      if (!data || (Array.isArray(data) && data.length === 0)) return;
      MEMORY_CACHE[key] = data;
      try {
        localStorage.setItem('cache_' + key, JSON.stringify({ ts: Date.now(), data }));
      } catch (e) {}
    }

    let currentTarget = JSON.parse(localStorage.getItem('savedTarget')) || {
      id: 19931,
      name: 'ИНС-б-о-26-2',
      type: 2
    };

    let selectedSubgroup = localStorage.getItem('savedSubgroup') || 'all';
    let lastLoadedDays = null;
    let showPastDaysForCurrentWeek = false;

    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const mon = new Date(d.setDate(diff));
      mon.setHours(0, 0, 0, 0);
      return mon;
    }

    // ДИНАМИЧЕСКИЙ СТАРТ С ТЕКУЩЕЙ НЕДЕЛИ
    let currentMonday = getMonday(new Date());
    let calendarMonthDate = new Date(currentMonday);
    let activeDaysWithClasses = new Set();

    function extractTime(isoStr, pairNum, isEnd = false) {
      if (isoStr && isoStr.includes('T')) {
        const timePart = isoStr.split('T')[1];
        const [h, m] = timePart.split(':');
        return `${h}:${m}`;
      }
      if (CALL_TIMES[pairNum]) {
        return isEnd ? CALL_TIMES[pairNum].end : CALL_TIMES[pairNum].start;
      }
      return '—';
    }

    function timeToMinutes(timeStr) {
      if (!timeStr || !timeStr.includes(':')) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function formatLocation(rawName) {
      if (!rawName) return '';
      const text = String(rawName).trim();
      if (text.includes('-')) {
        const parts = text.split('-');
        return `Корпус ${parts[0]}, Ауд. ${parts[1]}`;
      }
      return `Ауд. ${text}`;
    }

    function formatBreak(minutes) {
      if (minutes <= 0) return null;
      if (minutes >= 60) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        return `Перерыв ${h} ч ${m > 0 ? m + ' мин' : ''}`;
      }
      return `Перерыв ${minutes} мин`;
    }

    function simplifyLessonType(rawType) {
      if (!rawType) return '';
      const t = rawType.trim().toLowerCase();
      if (t.includes('практ')) return 'Практика';
      if (t.includes('лаб')) return 'Лаб. работа';
      if (t.includes('лекц')) return 'Лекция';
      if (t.includes('семин')) return 'Семинар';
      if (t.includes('зачет') || t.includes('зачёт')) return 'Зачёт';
      if (t.includes('экзамен')) return 'Экзамен';
      if (t.includes('конс')) return 'Консультация';
      return rawType.trim();
    }

    function normalizeGroupQuery(raw) {
      if (!raw) return raw;
      const clean = raw.trim().replace(/[\s\-_]+/g, '');
      
      const m1 = clean.match(/^([а-яёa-z]+?)(б|м|с|а)(о|з|оз)(\d{2})(\d*)$/i);
      if (m1) {
        const part5 = m1[5] ? `-${m1[5]}` : '';
        return `${m1[1].toUpperCase()}-${m1[2].toLowerCase()}-${m1[3].toLowerCase()}-${m1[4]}${part5}`;
      }

      const m2 = clean.match(/^([а-яёa-z]+?)(\d{2})(\d+)$/i);
      if (m2) {
        return `${m2[1].toUpperCase()}-${m2[2]}-${m2[3]}`;
      }

      return raw;
    }

    function setSubgroup(sg) {
      selectedSubgroup = sg;
      localStorage.setItem('savedSubgroup', sg);
      updateSubgroupUI();
      if (lastLoadedDays) {
        renderSchedule(lastLoadedDays);
      }
    }

    function updateSubgroupUI() {
      const toggleEl = document.getElementById('subgroupToggle');
      if (currentTarget.type === 2) {
        toggleEl.style.display = 'inline-flex';
        document.querySelectorAll('.sg-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-sg') === selectedSubgroup);
        });
      } else {
        toggleEl.style.display = 'none';
      }
    }

    function togglePastDays() {
      showPastDaysForCurrentWeek = !showPastDaysForCurrentWeek;
      if (lastLoadedDays) {
        renderSchedule(lastLoadedDays);
      }
    }

    function prefetchAdjacentWeeks() {
      [-1, 1].forEach(offset => {
        const d = new Date(currentMonday);
        d.setDate(d.getDate() + (offset * 7));
        const iso = d.toISOString();
        const cacheKey = `sched_${currentTarget.type}_${currentTarget.id}_${iso}`;
        if (!getCache(cacheKey)) {
          fetchWithProxy(`${API_BASE}/GetSchedule`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              date: iso,
              Id: currentTarget.id,
              targetType: currentTarget.type
            })
          }).then(r => r.json()).then(data => setCache(cacheKey, data)).catch(() => {});
        }
      });
    }

    async function loadSchedule() {
      const statusEl = document.getElementById('statusText');
      const container = document.getElementById('scheduleContainer');
      document.getElementById('groupTitle').innerText = currentTarget.name;

      updateSubgroupUI();

      const dateStr = currentMonday.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('currentWeekText').innerText = `С ${dateStr}`;
      
      const isoDate = currentMonday.toISOString();
      const cacheKey = `sched_${currentTarget.type}_${currentTarget.id}_${isoDate}`;

      const cached = getCache(cacheKey);
      if (cached) {
        statusEl.innerText = 'Из кэша (мгновенно)';
        lastLoadedDays = cached;
        renderSchedule(cached);
        prefetchAdjacentWeeks();
        return;
      }

      statusEl.innerText = 'Загрузка...';
      container.innerHTML = '<div class="empty-day" style="text-align:center; padding: 40px 0;">Загрузка расписания...</div>';

      try {
        const response = await fetchWithProxy(`${API_BASE}/GetSchedule`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: isoDate,
            Id: currentTarget.id,
            targetType: currentTarget.type
          })
        });

        const data = await response.json();
        setCache(cacheKey, data);
        statusEl.innerText = 'Актуально';
        lastLoadedDays = data;
        renderSchedule(data);
        prefetchAdjacentWeeks();
      } catch (err) {
        statusEl.innerText = 'Ошибка сети';
        container.innerHTML = '<div class="empty-day" style="color:#ef4444; text-align:center;">Не удалось загрузить данные. Попробуйте обновить страницу.</div>';
      }
    }

    function renderSchedule(days) {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      activeDaysWithClasses.clear();

      if (!days || !days.length) {
        container.innerHTML = '<div class="day-card empty-day">Пар на этой неделе нет</div>';
        renderCalendarGrid();
        return;
      }

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const realCurrentMonday = getMonday(now);
      const isViewingCurrentWeek = currentMonday.getTime() === realCurrentMonday.getTime();

      let hiddenPastDaysCount = 0;
      const dayCardsToRender = [];

      days.forEach(day => {
        let dateStr = '';
        let localDate = null;
        let isPastDay = false;
        let isToday = false;

        if (day.Date) {
          const datePart = day.Date.split('T')[0];
          const [y, m, d] = datePart.split('-');
          localDate = new Date(y, m - 1, d);
          localDate.setHours(0,0,0,0);
          dateStr = localDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

          if (isViewingCurrentWeek) {
            if (localDate.getTime() < today.getTime()) {
              isPastDay = true;
            } else if (localDate.getTime() === today.getTime()) {
              isToday = true;
            }
          }
        }

        let lessons = day.Lessons || [];

        // Фильтрация по подгруппе
        if (currentTarget.type === 2 && selectedSubgroup !== 'all') {
          lessons = lessons.filter(l => {
            let sg = '';
            if (l.Groups && l.Groups.length > 0) {
              const matchedGrp = l.Groups.find(g => g.Id === currentTarget.id) || l.Groups[0];
              if (matchedGrp && matchedGrp.Subgroup) {
                sg = matchedGrp.Subgroup.trim();
              }
            }
            if (!sg) return true;
            const digits = sg.replace(/\D/g, '');
            if (!digits) return true;
            return digits === selectedSubgroup;
          });
        }

        if (localDate && lessons.length > 0) {
          activeDaysWithClasses.add(`${localDate.getFullYear()}-${localDate.getMonth()}-${localDate.getDate()}`);
        }

        // Если это прошедший день текущей недели и они скрыты
        if (isPastDay && !showPastDaysForCurrentWeek) {
          hiddenPastDaysCount++;
          return;
        }

        const card = document.createElement('div');
        card.className = `day-card ${isToday ? 'today-card' : ''}`;

        card.innerHTML = `
          <div class="day-header">
            <div class="day-title-wrap">
              <span class="day-title">${day.WeekDay || ''}</span>
              ${isToday ? '<span class="today-badge">Сегодня</span>' : ''}
            </div>
            <span class="day-date">${dateStr}</span>
          </div>
        `;

        if (!lessons.length) {
          card.innerHTML += '<div class="empty-day">Пар нет</div>';
        } else {
          lessons.sort((a, b) => (a.PairNumberStart || 0) - (b.PairNumberStart || 0));

          let prevEndTimeStr = null;

          lessons.forEach((l, index) => {
            const pairNum = l.PairNumberStart || (index + 1);
            const startTimeStr = extractTime(l.TimeBegin, pairNum, false);
            const endTimeStr = extractTime(l.TimeEnd, pairNum, true);

            if (prevEndTimeStr) {
              const prevMin = timeToMinutes(prevEndTimeStr);
              const currMin = timeToMinutes(startTimeStr);
              const diffMin = currMin - prevMin;

              if (diffMin > 0) {
                const breakDiv = document.createElement('div');
                breakDiv.className = 'break-indicator';
                breakDiv.textContent = formatBreak(diffMin);
                card.appendChild(breakDiv);
              }
            }

            prevEndTimeStr = endTimeStr;

            const item = document.createElement('div');
            const rawType = (l.LessonType || '').trim();
            const typeLower = rawType.toLowerCase();
            const displayType = simplifyLessonType(rawType);

            let typeClass = 'type-other';
            let badgeClass = 'badge-def';
            if (typeLower.includes('лекц')) {
              typeClass = 'type-lecture';
              badgeClass = 'badge-lec';
            } else if (typeLower.includes('практ') || typeLower.includes('лаб') || typeLower.includes('семин')) {
              typeClass = 'type-practice';
              badgeClass = 'badge-prac';
            }

            item.className = `lesson-item ${typeClass}`;

            const audName = (l.Aud && l.Aud.Name) ? l.Aud.Name : '';
            const roomFormatted = formatLocation(audName);
            const teacherName = (l.Teacher && l.Teacher.Name) ? l.Teacher.Name.trim() : '';

            let subgroup = '';
            if (l.Groups && l.Groups[0] && l.Groups[0].Subgroup) {
              subgroup = l.Groups[0].Subgroup.trim();
            }

            let extraGroupInfo = '';
            if (currentTarget.type === 1 && l.Groups && l.Groups.length > 0) {
              extraGroupInfo = l.Groups.map(g => g.Name).join(', ');
            }

            item.innerHTML = `
              <div class="pair-time-block">
                <span class="pair-num">${pairNum} пара</span>
                <span class="pair-hours">${startTimeStr} - ${endTimeStr}</span>
              </div>
              <div class="lesson-main">
                <div class="lesson-title">${l.Discipline || 'Предмет'}</div>
                <div class="lesson-meta">
                  ${displayType ? `<span class="badge ${badgeClass}">${displayType}</span>` : ''}
                  ${subgroup ? `<span class="subgroup-tag">Подгруппа ${subgroup}</span>` : ''}
                  ${roomFormatted ? `<span class="room-tag">📍 ${roomFormatted}</span>` : ''}
                  ${extraGroupInfo ? `<span class="subgroup-tag">👥 ${extraGroupInfo}</span>` : ''}
                </div>
              </div>
              <div class="teacher-block">
                ${teacherName ? `👤 ${teacherName}` : ''}
              </div>
            `;
            card.appendChild(item);
          });
        }

        dayCardsToRender.push(card);
      });

      // Кнопка управления показом прошедших дней на текущей неделе
      if (isViewingCurrentWeek) {
        if (hiddenPastDaysCount > 0) {
          const toggleBtn = document.createElement('button');
          toggleBtn.className = 'past-days-toggle-btn';
          toggleBtn.innerHTML = `<span>🕒</span> Показать прошедшие дни этой недели (${hiddenPastDaysCount})`;
          toggleBtn.onclick = togglePastDays;
          container.appendChild(toggleBtn);
        } else if (showPastDaysForCurrentWeek) {
          const toggleBtn = document.createElement('button');
          toggleBtn.className = 'past-days-toggle-btn';
          toggleBtn.innerHTML = `<span>▲</span> Скрыть прошедшие дни`;
          toggleBtn.onclick = togglePastDays;
          container.appendChild(toggleBtn);
        }
      }

      if (dayCardsToRender.length === 0) {
        container.innerHTML += '<div class="day-card empty-day">Все пары на этой неделе завершены 🎉</div>';
      } else {
        dayCardsToRender.forEach(c => container.appendChild(c));
      }

      renderCalendarGrid();
    }

    function changeWeek(offset) {
      currentMonday.setDate(currentMonday.getDate() + (offset * 7));
      calendarMonthDate = new Date(currentMonday);
      showPastDaysForCurrentWeek = false;
      loadSchedule();
    }

    // Календарь
    const calendarPopup = document.getElementById('calendarPopup');
    const calendarGrid = document.getElementById('calendarGrid');

    function toggleCalendar() {
      if (calendarPopup.style.display === 'block') {
        calendarPopup.style.display = 'none';
      } else {
        calendarMonthDate = new Date(currentMonday);
        renderCalendarGrid();
        calendarPopup.style.display = 'block';
      }
    }

    function changeCalMonth(offset) {
      calendarMonthDate.setMonth(calendarMonthDate.getMonth() + offset);
      renderCalendarGrid();
    }

    function renderCalendarGrid() {
      const year = calendarMonthDate.getFullYear();
      const month = calendarMonthDate.getMonth();
      
      const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      document.getElementById('calMonthTitle').innerText = `${monthNames[month]} ${year}`;

      calendarGrid.innerHTML = '';

      const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      weekdays.forEach(w => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = w;
        calendarGrid.appendChild(el);
      });

      const firstDayOfMonth = new Date(year, month, 1);
      let startDay = firstDayOfMonth.getDay();
      startDay = startDay === 0 ? 6 : startDay - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-day-cell empty';
        calendarGrid.appendChild(emptyCell);
      }

      const monTime = currentMonday.getTime();
      const sunTime = monTime + 6 * 86400000;

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day-cell';
        cell.textContent = day;

        const cellDate = new Date(year, month, day);
        cellDate.setHours(0,0,0,0);
        const cellTime = cellDate.getTime();

        if (cellTime >= monTime && cellTime <= sunTime) {
          cell.classList.add('in-week');
          if (cellTime === monTime) {
            cell.classList.add('selected');
          }
        }

        const dateKey = `${year}-${month}-${day}`;
        if (activeDaysWithClasses.has(dateKey)) {
          cell.classList.add('has-classes');
        }

        cell.onclick = () => {
          currentMonday = getMonday(cellDate);
          showPastDaysForCurrentWeek = false;
          calendarPopup.style.display = 'none';
          loadSchedule();
        };

        calendarGrid.appendChild(cell);
      }
    }

    // ПОИСК
    let searchTimeout = null;
    let currentSearchController = null;
    const searchInput = document.getElementById('searchInput');
    const autoList = document.getElementById('autocompleteList');

    async function queryServerSearch(text, signal) {
      const targetUrl = `${API_BASE}/search?q=${encodeURIComponent(text)}`;
      const res = await fetchWithProxy(targetUrl, { signal });
      const htmlText = await res.text();
      const items = [];

      const modelMatch = htmlText.match(/"Model"\s*:\s*(\{[^}]+\})/);
      if (modelMatch && modelMatch[1]) {
        try {
          const modelData = JSON.parse(modelMatch[1]);
          if (modelData.Id && modelData.Name) {
            let typeName = 'Группа';
            let targetType = modelData.Type || 2;
            if (targetType === 1) typeName = 'Преподаватель';
            else if (targetType === 2) typeName = 'Группа';
            else if (targetType === 3) typeName = 'Аудитория';

            items.push({
              id: modelData.Id,
              name: modelData.Name.trim(),
              targetType: targetType,
              typeName: typeName
            });
          }
        } catch (e) {}
      }

      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const links = doc.querySelectorAll('a[href*="/schedule/"]');
      
      links.forEach(a => {
        const href = a.getAttribute('href') || '';
        const name = a.textContent.replace(/\s+/g, ' ').trim();
        if (!name || name === 'Расписание' || name.toLowerCase().includes('войти') || name.includes('<-') || name.includes('->')) return;

        const cleanHref = href.split('?')[0];
        const parts = cleanHref.split('/').filter(Boolean);
        const typeIndex = parts.indexOf('schedule');
        if (typeIndex === -1 || typeIndex + 2 >= parts.length) return;

        const typeStr = parts[typeIndex + 1].toLowerCase();
        const id = parseInt(parts[typeIndex + 2], 10);
        if (!id) return;

        let targetType = 2;
        let typeName = 'Группа';
        if (typeStr.includes('person') || typeStr.includes('teacher')) {
          targetType = 1;
          typeName = 'Преподаватель';
        } else if (typeStr.includes('aud') || typeStr.includes('room')) {
          targetType = 3;
          typeName = 'Аудитория';
        } else if (typeStr.includes('group')) {
          targetType = 2;
          typeName = 'Группа';
        }

        if (!items.some(it => it.id === id && it.targetType === targetType)) {
          items.push({ id, name, targetType, typeName });
        }
      });

      return items;
    }

    async function executeSearch(queryText, isEnter = false) {
      if (!queryText || queryText.length < 2) {
        autoList.style.display = 'none';
        return;
      }

      if (currentSearchController) currentSearchController.abort();
      currentSearchController = new AbortController();

      try {
        const normalized = normalizeGroupQuery(queryText);
        
        let items = await queryServerSearch(normalized, currentSearchController.signal);

        if (!items.length && normalized !== queryText) {
          items = await queryServerSearch(queryText, currentSearchController.signal);
        }

        if (items.length > 0) {
          setCache('search_' + queryText.toLowerCase(), items);
        }

        if (isEnter && items.length === 1) {
          selectTarget(items[0].id, items[0].name, items[0].targetType);
          autoList.style.display = 'none';
          searchInput.value = '';
          return;
        }

        renderAutocomplete(items);
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error('Ошибка поиска:', err);
        }
      }
    }

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      
      if (query.length < 2) {
        autoList.style.display = 'none';
        if (currentSearchController) currentSearchController.abort();
        return;
      }

      const cached = getCache('search_' + query.toLowerCase());
      if (cached && cached.length > 0) {
        renderAutocomplete(cached);
        return;
      }

      searchTimeout = setTimeout(() => {
        executeSearch(query, false);
      }, 250);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(searchTimeout);
        executeSearch(searchInput.value.trim(), true);
      }
    });

    function renderAutocomplete(items) {
      if (!items || !items.length) {
        autoList.style.display = 'none';
        return;
      }
      autoList.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.innerHTML = `
          <span>${item.name}</span>
          <span class="autocomplete-type">${item.typeName}</span>
        `;
        div.onclick = () => {
          selectTarget(item.id, item.name, item.targetType);
          autoList.style.display = 'none';
          searchInput.value = '';
        };
        autoList.appendChild(div);
      });
      autoList.style.display = 'block';
    }

    function selectTarget(id, name, type) {
      currentTarget = { id, name, type };
      localStorage.setItem('savedTarget', JSON.stringify(currentTarget));
      closeCatalog();
      loadSchedule();
    }

    // Каталог
    let catalogStep = 1;
    let selectedInstitute = null;

    function openCatalog() {
      document.getElementById('catalogModal').style.display = 'flex';
      renderInstitutesList();
    }

    function closeCatalog() {
      document.getElementById('catalogModal').style.display = 'none';
    }

    function renderInstitutesList() {
      catalogStep = 1;
      document.getElementById('modalTitle').innerText = 'Выбор института / факультета';
      document.getElementById('breadcrumbs').style.display = 'none';
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      INSTITUTES.forEach(inst => {
        const div = document.createElement('div');
        div.className = 'catalog-item full-width';
        div.innerHTML = `<strong>${inst.ShortName}</strong> — ${inst.Name}`;
        div.onclick = () => loadSpecialities(inst);
        container.appendChild(div);
      });
    }

    async function loadSpecialities(inst) {
      catalogStep = 2;
      selectedInstitute = inst;
      document.getElementById('modalTitle').innerText = inst.Name;
      document.getElementById('breadcrumbs').style.display = 'inline-block';
      const container = document.getElementById('catalogContainer');

      const cacheKey = `specs_${inst.Id}_${inst.BranchId}`;
      const cached = getCache(cacheKey);
      if (cached) {
        renderSpecsList(inst, cached);
        return;
      }

      container.innerHTML = '<div class="empty-day" style="text-align:center; padding: 20px;">Загрузка специальностей...</div>';

      try {
        const res = await fetchWithProxy(`${API_BASE}/GetSpecialities`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instituteId: inst.Id, branchId: inst.BranchId })
        });
        const specs = await res.json();
        setCache(cacheKey, specs);
        renderSpecsList(inst, specs);
      } catch (err) {
        container.innerHTML = '<div class="empty-day" style="color:#ef4444;">Не удалось загрузить специальности</div>';
      }
    }

    function renderSpecsList(inst, specs) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';
      if (!specs || !specs.length) {
        container.innerHTML = '<div class="empty-day">Направления не найдены</div>';
        return;
      }
      specs.forEach(spec => {
        const div = document.createElement('div');
        div.className = 'catalog-item full-width';
        div.textContent = spec.Name;
        div.onclick = () => loadGroups(inst.Id, inst.BranchId, spec.Name);
        container.appendChild(div);
      });
    }

    async function loadGroups(instId, branchId, specName) {
      catalogStep = 3;
      document.getElementById('modalTitle').innerText = specName;
      const container = document.getElementById('catalogContainer');

      const cacheKey = `groups_${instId}_${branchId}_${specName}`;
      const cached = getCache(cacheKey);
      if (cached) {
        renderGroupsList(cached);
        return;
      }

      container.innerHTML = '<div class="empty-day" style="text-align:center; padding: 20px;">Загрузка групп...</div>';

      try {
        const res = await fetchWithProxy(`${API_BASE}/GetAcademicGroups`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instituteId: instId, specialty: specName, branchId: branchId })
        });
        const groupsData = await res.json();
        setCache(cacheKey, groupsData);
        renderGroupsList(groupsData);
      } catch (err) {
        container.innerHTML = '<div class="empty-day" style="color:#ef4444;">Не удалось загрузить группы</div>';
      }
    }

    function renderGroupsList(groupsData) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';
      if (!groupsData || !groupsData.length) {
        container.innerHTML = '<div class="empty-day">Группы не найдены</div>';
        return;
      }

      groupsData.forEach(block => {
        const title = document.createElement('div');
        title.style.cssText = 'font-weight: 700; color: var(--accent); margin: 12px 0 6px 0; font-size: 0.9rem; text-align: left;';
        title.textContent = block.Key || 'Группы';
        container.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'groups-grid';

        (block.Value || []).forEach(grp => {
          const div = document.createElement('div');
          div.className = 'catalog-item';
          div.textContent = grp.Name;
          div.onclick = () => selectTarget(grp.Id, grp.Name, 2);
          grid.appendChild(div);
        });

        container.appendChild(grid);
      });
    }

    function goBackCatalog() {
      if (catalogStep === 3) {
        loadSpecialities(selectedInstitute);
      } else if (catalogStep === 2) {
        renderInstitutesList();
      }
    }

    // Темы
    const THEME_PRESETS = {
      dark: {
        '--bg': '#0b0f19',
        '--card-bg': '#151d30',
        '--text': '#f1f5f9',
        '--text-muted': '#94a3b8',
        '--border': 'rgba(255, 255, 255, 0.08)',
        '--accent': '#38bdf8',
        '--lecture-bg': 'rgba(16, 185, 129, 0.15)',
        '--lecture-border': 'rgba(16, 185, 129, 0.45)',
        '--lecture-badge': '#10b981',
        '--practice-bg': 'rgba(245, 158, 11, 0.15)',
        '--practice-border': 'rgba(245, 158, 11, 0.45)',
        '--practice-badge': '#f59e0b'
      },
      light: {
        '--bg': '#f8fafc',
        '--card-bg': '#ffffff',
        '--text': '#0f172a',
        '--text-muted': '#64748b',
        '--border': 'rgba(0, 0, 0, 0.08)',
        '--accent': '#0284c7',
        '--lecture-bg': 'rgba(16, 185, 129, 0.12)',
        '--lecture-border': 'rgba(16, 185, 129, 0.4)',
        '--lecture-badge': '#10b981',
        '--practice-bg': 'rgba(245, 158, 11, 0.12)',
        '--practice-border': 'rgba(245, 158, 11, 0.4)',
        '--practice-badge': '#f59e0b'
      },
      oled: {
        '--bg': '#000000',
        '--card-bg': '#0f0f11',
        '--text': '#ffffff',
        '--text-muted': '#a1a1aa',
        '--border': 'rgba(255, 255, 255, 0.12)',
        '--accent': '#38bdf8',
        '--lecture-bg': 'rgba(16, 185, 129, 0.15)',
        '--lecture-border': 'rgba(16, 185, 129, 0.5)',
        '--lecture-badge': '#10b981',
        '--practice-bg': 'rgba(245, 158, 11, 0.15)',
        '--practice-border': 'rgba(245, 158, 11, 0.5)',
        '--practice-badge': '#f59e0b'
      }
    };

    let userTheme = JSON.parse(localStorage.getItem('customUserTheme')) || THEME_PRESETS.dark;

    function applyCurrentTheme() {
      Object.keys(userTheme).forEach(prop => {
        document.documentElement.style.setProperty(prop, userTheme[prop]);
      });
      syncThemePickers();
    }

    function syncThemePickers() {
      const getHex = (v) => v && v.startsWith('#') ? v : '#38bdf8';
      if (document.getElementById('picker-bg')) {
        document.getElementById('picker-bg').value = getHex(userTheme['--bg'] || '#0b0f19');
        document.getElementById('picker-card').value = getHex(userTheme['--card-bg'] || '#151d30');
        document.getElementById('picker-accent').value = getHex(userTheme['--accent'] || '#38bdf8');
        document.getElementById('picker-lecture').value = getHex(userTheme['--lecture-badge'] || '#10b981');
        document.getElementById('picker-practice').value = getHex(userTheme['--practice-badge'] || '#f59e0b');
        document.getElementById('picker-text').value = getHex(userTheme['--text'] || '#f1f5f9');
      }
    }

    function applyPreset(name) {
      userTheme = { ...THEME_PRESETS[name] };
      localStorage.setItem('customUserTheme', JSON.stringify(userTheme));
      applyCurrentTheme();
    }

    function onCustomColorChange(variableName, hexValue) {
      userTheme[variableName] = hexValue;
      document.documentElement.style.setProperty(variableName, hexValue);
      localStorage.setItem('customUserTheme', JSON.stringify(userTheme));
    }

    function onCustomLectureChange(hexValue) {
      userTheme['--lecture-badge'] = hexValue;
      userTheme['--lecture-bg'] = hexValue + '22';
      userTheme['--lecture-border'] = hexValue + '77';
      document.documentElement.style.setProperty('--lecture-badge', hexValue);
      document.documentElement.style.setProperty('--lecture-bg', hexValue + '22');
      document.documentElement.style.setProperty('--lecture-border', hexValue + '77');
      localStorage.setItem('customUserTheme', JSON.stringify(userTheme));
    }

    function onCustomPracticeChange(hexValue) {
      userTheme['--practice-badge'] = hexValue;
      userTheme['--practice-bg'] = hexValue + '22';
      userTheme['--practice-border'] = hexValue + '77';
      document.documentElement.style.setProperty('--practice-badge', hexValue);
      document.documentElement.style.setProperty('--practice-bg', hexValue + '22');
      document.documentElement.style.setProperty('--practice-border', hexValue + '77');
      localStorage.setItem('customUserTheme', JSON.stringify(userTheme));
    }

    function openThemeModal() {
      document.getElementById('themeModal').style.display = 'flex';
      syncThemePickers();
    }

    function closeThemeModal() {
      document.getElementById('themeModal').style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !autoList.contains(e.target)) {
        autoList.style.display = 'none';
      }
      if (!calendarPopup.contains(e.target) && !document.getElementById('calendarToggleBtn').contains(e.target)) {
        calendarPopup.style.display = 'none';
      }
    });

    applyCurrentTheme();
    loadSchedule();

    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.error('Ошибка регистрации Service Worker:', err);
        });
      });
    }
  </script>
</body>
